<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>joinville-alerta-v2 | Emergência de Alagamentos</title>
  
  <!-- Suporte e Configurações de PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5664/5664993.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🌧️ joinville-alerta-v2</h1>
    <p id="last-update">Atualizando telemetria...</p>
  </header>

  <main>
    <!-- Card do Agente de IA (Mistral) -->
    <section class="ai-card">
      <div class="ai-header">
        <span class="badge-risk" id="ai-risk-badge">...</span>
        <small style="color: #94a3b8; font-size: 0.7rem;">🤖 Agente Mistral AI</small>
      </div>
      <h2 id="ai-title">Carregando diagnóstico...</h2>
      <p id="ai-message">Consultando dados de chuva e maré no Rio Cachoeira...</p>
    </section>

    <!-- Métricas Hidrometeorológicas -->
    <section class="metrics-grid">
      <div class="metric-card">
        <span>Chuva Acumulada (24h)</span>
        <strong id="m-rain">-- mm</strong>
      </div>
      <div class="metric-card">
        <span>Maré Babitonga</span>
        <strong id="m-tide">-- m</strong>
      </div>
    </section>

    <!-- Geolocalização & Barra de Pesquisa de Ruas -->
    <section class="search-box">
      <button id="btn-location" class="location-btn" type="button">
        📍 Usar minha localização
      </button>
      <input 
        type="text" 
        id="street-search" 
        class="search-input" 
        placeholder="🔍 Digite sua rua ou bairro (ex: Procópio Gomes, Bucarein)..." 
      />
    </section>

    <!-- Lista Dinâmica de Bairros e Ruas Críticas -->
    <section id="bairros-container">
      <!-- Inserido dinamicamente pelo JS -->
    </section>
  </main>

  <footer>
    <p>joinville-alerta-v2 • Informação comunitária direta ao cidadão</p>
  </footer>

  <!-- Script Principal do App -->
  <script type="module" src="app.js"></script>

  <!-- Registro do Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('[PWA] Service Worker registrado com sucesso:', reg.scope))
          .catch((err) => console.error('[PWA] Falha ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
